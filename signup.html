<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Quantum Trading AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-header">
                <span class="eyebrow">Create account</span>
                <h1>Start trading with <span class="accent-text">AI</span></h1>
            </div>

            <form id="signup-form" class="auth-form" novalidate>
                <div class="form-field">
                    <label for="signup-name">Full name</label>
                    <input id="signup-name" name="name" type="text" placeholder="Your name" required>
                </div>

                <div class="form-field">
                    <label for="signup-email">Email</label>
                    <input id="signup-email" name="email" type="email" placeholder="you@example.com" required>
                </div>

                <div class="form-field">
                    <label for="signup-password">Password</label>
                    <input id="signup-password" name="password" type="password" placeholder="Create a password" required>
                </div>

                <div class="form-message" data-form-message></div>
                <button type="submit" class="auth-button">Create account</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="signin.html">Login</a>
            </p>
        </section>
    </main>

    <script src="auth.js"></script>
</body>
</html>
