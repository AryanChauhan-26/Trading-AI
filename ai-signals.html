<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Signals - Quantum Trading AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="static.css">
</head>
<body class="signals-page">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <div class="static-container signals-container">
        <header class="static-header signal-header">
            <div class="signal-header__copy">
                <span class="header-chip">AI trading desk</span>
                <h1>AI <span class="accent-text">Signals</span> Command Center</h1>
                <p>Actionable trading bias, consensus strength, and technical rationale across major markets.</p>
            </div>
            <div class="signal-header__actions">
                <a href="index.html" class="btn-secondary btn-header-action">
                    <span class="btn-header-action__icon">←</span>
                    <span>Back to dashboard</span>
                </a>
            </div>
        </header>

        <section class="signal-topbar card">
            <div class="summary-metric">
                <span class="summary-label">Bullish Signals</span>
                <strong id="bullishCount">0</strong>
            </div>
            <div class="summary-metric">
                <span class="summary-label">Bearish Signals</span>
                <strong id="bearishCount">0</strong>
            </div>
            <div class="summary-metric">
                <span class="summary-label">Average Confidence</span>
                <strong id="avgConfidence">0%</strong>
            </div>
            <div class="summary-metric summary-metric--accent">
                <span class="summary-label">Market Pulse</span>
                <strong id="marketPulse">Neutral</strong>
            </div>
        </section>

        <section class="signal-panel card">
            <div class="signal-panel__header">
                <div>
                    <p class="signal-panel__eyebrow">Live signal feed</p>
                    <h2>AI Market Radar</h2>
                </div>
                <div class="signal-filters" aria-label="Signal filters">
                    <button class="signal-filter is-active" data-filter="all">All</button>
                    <button class="signal-filter" data-filter="buy">Buy</button>
                    <button class="signal-filter" data-filter="sell">Sell</button>
                    <button class="signal-filter" data-filter="neutral">Neutral</button>
                </div>
            </div>

            <div id="signal-feed" class="signal-feed" aria-live="polite"></div>
        </section>
    </div>

    <script src="ai-signals.js"></script>
</body>
</html>
